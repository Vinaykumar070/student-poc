<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body {
      background: linear-gradient(to right, #43e97b, #38f9d7);
      height: 100vh;
    }
    .register-card {
      max-width: 400px;
      margin: auto;
      margin-top: 10%;
      padding: 30px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="card register-card shadow">
  <h3 class="text-center mb-3">Register</h3>

  <!-- Error Container -->
  <div id="errorContainer"></div>

  <input id="username" class="form-control mb-3" placeholder="Username">
  <input id="password" type="password" class="form-control mb-3" placeholder="Password">

  <button id="registerBtn" class="btn btn-success w-100" onclick="register()">
    Register
  </button>

  <p class="text-center mt-3">
    Already have account? <a href="login.html">Login</a>
  </p>
</div>

<!-- Handlebars Template -->
<script id="error-template" type="text/x-handlebars-template">
  <div class="alert alert-danger">
    {{message}}
  </div>
</script>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>

<script>
function register() {
  const username = $("#username").val().trim();
  const password = $("#password").val().trim();

  // Clear old errors
  $("#errorContainer").html("");

  // Validation
  if (!username || !password) {
    showError("Please enter username and password");
    return;
  }

  // Button loading state
  $("#registerBtn").text("Registering...").prop("disabled", true);

  $.ajax({
    url: "https://student-poc.onrender.com/api/auth/register",
    method: "POST",
    contentType: "application/json",
    data: JSON.stringify({ username, password }),

    success: function () {
      alert("Registration successful");
      window.location.href = "/login.html";
    },

    error: function (err) {
      const message =
        err.responseJSON?.message || "Registration failed";
      showError(message);
    },

    complete: function () {
      $("#registerBtn").text("Register").prop("disabled", false);
    }
  });
}

// Handlebars Error Renderer
function showError(msg) {
  const source = $("#error-template").html();
  const template = Handlebars.compile(source);

  $("#errorContainer").html(template({ message: msg }));
}
</script>

</body>
</html>
