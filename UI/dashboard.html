<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body { overflow-x: hidden; }
    .sidebar {
      height: 100vh;
      background: #343a40;
      color: white;
      padding: 20px;
    }
    .sidebar a {
      color: white;
      display: block;
      margin: 10px 0;
      text-decoration: none;
    }
    .sidebar a:hover { color: #0d6efd; }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
      <h4>Student App</h4>
      <!--<a href="/dashboard.html">Dashboard</a>-->
      <button class="btn btn-danger mt-3" onclick="logout()">Logout</button>
    </div>

    <!-- Main -->
    <div class="col-md-10">

      <nav class="navbar navbar-light bg-light">
        <span class="navbar-brand">Dashboard</span>
      </nav>

      <!-- Card -->
      <!--<div class="row mt-3">
        <div class="col-md-4">
          <div class="card text-center shadow-sm">
            <div class="card-body">
              <h6>Total Students</h6>
              <h2 id="totalStudents">0</h2>
            </div>
          </div>
        </div>
      </div> -->

      <!-- Table -->
      <div class="card mt-4 shadow-sm">
        <div class="card-body">

          <div class="d-flex justify-content-between mb-3">
            <h5>Student List</h5>
            <button class="btn btn-success" onclick="openAddModal()">+ Add Student</button>
          </div>

          <div class="table-responsive">
            <table class="table table-bordered">
              <thead class="table-dark">
                <tr>
                  <th>Student ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentTableBody"></tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="d-flex justify-content-between mt-3">
            <button class="btn btn-primary" onclick="prevPage()">Previous</button>
            <span id="pageInfo">Page 1</span>
            <button class="btn btn-primary" onclick="nextPage()">Next</button>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!--HANDLEBARS TEMPLATE -->
<script id="student-template" type="text/x-handlebars-template">
  {{#if students.length}}
    {{#each students}}
      <tr>
        <td>{{studentId}}</td>
        <td>{{name}}</td>
        <td>{{email}}</td>
        <td>
          <button class="btn btn-sm btn-warning"
            onclick="openEditModal('{{studentId}}','{{name}}','{{course}}','{{age}}','{{email}}')">
            Edit
          </button>
          <button class="btn btn-sm btn-danger"
            onclick="deleteStudent('{{studentId}}')">
            Delete
          </button>
        </td>
      </tr>
    {{/each}}
  {{else}}
    <tr><td colspan="4">No data</td></tr>
  {{/if}}
</script>

<!-- Modal -->
<div class="modal fade" id="studentModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 id="modalTitle">Add Student</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="studentId">
        <input id="studentName" class="form-control mb-2" placeholder="Name">
        <input id="studentCourse" class="form-control mb-2" placeholder="Course">
        <input id="studentAge" class="form-control mb-2" placeholder="Age">
        <input id="studentEmail" class="form-control mb-2" placeholder="Email">
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveStudent()">Save</button>
      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let currentPage = 1;
let totalPages = 1;
const limit = 5; // or whatever you want

function loadStudents(page = 1) {
  const token = localStorage.getItem("token");

  $.ajax({
    url: `https://student-poc.onrender.com/api/students?page=${page}&limit=${limit}`,
    method: "GET",
    headers: { "Authorization": "Bearer " + token },

    success: function (response) {

      const students = response.data || [];

      // FIX: Set correct page values
      currentPage = page;
      totalPages = response.totalPages;

      // Update total count
      $("#totalStudents").text(response.totalRecords);

      // Add index properly
      const formatted = students.map((s, i) => ({
        ...s,
        index: (currentPage - 1) * limit + i + 1
      }));

      // Compile template
      const source = $("#student-template").html();
      const template = Handlebars.compile(source);

      $("#studentTableBody").html(template({ students: formatted }));

      // Update page info
      $("#pageInfo").text(`Page ${currentPage} of ${totalPages}`);

      // Disable buttons when needed
      $("#prevBtn").prop("disabled", currentPage === 1);
      $("#nextBtn").prop("disabled", currentPage === totalPages);
    },

    error: function () {
      alert("Failed to load students");
    }
  });
}

//  Pagination
function nextPage() {
  if (currentPage < totalPages) {
    loadStudents(currentPage + 1);
  }
}

function prevPage() {
  if (currentPage > 1) {
    loadStudents(currentPage - 1);
  }
}

//  Modal
function openAddModal() {
  $("#studentId").val("");
  $("#studentName, #studentCourse, #studentAge, #studentEmail").val("");
  $("#modalTitle").text("Add Student");

  new bootstrap.Modal(document.getElementById("studentModal")).show();
}

function openEditModal(id, name, email) {
  $("#studentId").val(id);
  $("#studentName").val(name);
  $("#studentCourse").val("");
  $("#studentAge").val("");
  $("#studentEmail").val(email);
  $("#modalTitle").text("Edit Student");

  new bootstrap.Modal(document.getElementById("studentModal")).show();
}

//  Save
function saveStudent() {
  const id = $("#studentId").val();

  const student = {
    name: $("#studentName").val(),
    course: $("#studentCourse").val(),
    age: $("#studentAge").val(),
    email: $("#studentEmail").val()
  };

  const token = localStorage.getItem("token");

  const url = id
    ? `https://student-poc.onrender.com/api/students/${id}`
    : `https://student-poc.onrender.com/api/students`;

  const method = id ? "PUT" : "POST";

  $.ajax({
    url,
    method,
    headers: { "Authorization": "Bearer " + token },
    contentType: "application/json",
    data: JSON.stringify(student),

    success: function () {
      bootstrap.Modal.getInstance(document.getElementById("studentModal")).hide();
      loadStudents(currentPage);
    }
  });
}

// Delete
function deleteStudent(id) {
  if (!confirm("Delete student?")) return;

  const token = localStorage.getItem("token");

  $.ajax({
    url: `https://student-poc.onrender.com/api/students/${id}`,
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token },

    success: function () {
      loadStudents(currentPage);
    }
  });
}

// Logout
function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login.html";
}

// Initial Load
loadStudents();
</script>

</body>
</html>
