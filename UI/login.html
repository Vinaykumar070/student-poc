<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      height: 100vh;
    }
    .login-card {
      max-width: 400px;
      margin: auto;
      margin-top: 10%;
      padding: 30px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="card login-card shadow">
  <h3 class="text-center mb-3">Login</h3>

  <!-- 🔹 Handlebars Error Template -->
  <div id="errorContainer"></div>

  <input id="username" class="form-control mb-3" placeholder="Username">
  <input id="password" type="password" class="form-control mb-3" placeholder="Password">

  <button id="loginBtn" class="btn btn-primary w-100" onclick="login()">Login</button>

  <p class="text-center mt-3">
    New user? <a href="/register.html">Register</a>
  </p>
</div>

<!-- HANDLEBARS TEMPLATE -->
<script id="error-template" type="text/x-handlebars-template">
  <div class="alert alert-danger">
    {{message}}
  </div>
</script>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>

<script>

  // Auto redirect if already logged in
  $(document).ready(function () {
    const token = localStorage.getItem("token");
    if (token) {
      window.location.href = "/dashboard.html";
    }
  });

  // LOGIN using AJAX
  function login() {
    const username = $("#username").val().trim();
    const password = $("#password").val().trim();

    // Clear previous error
    $("#errorContainer").html("");

    // Validation
    if (!username || !password) {
      showError("Please enter username and password");
      return;
    }

    // Button loading state
    $("#loginBtn").text("Logging in...").prop("disabled", true);

    $.ajax({
      url: "http://localhost:3000/api/auth/login",
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify({ username, password }),

      success: function (data) {
        if (data.accessToken) {
          localStorage.setItem("token", data.accessToken);
          window.location.href = "/dashboard.html";
        } else {
          showError("Invalid credentials");
        }
      },

      error: function (err) {
        const message =
          err.responseJSON?.message || "Login failed. Please try again.";
        showError(message);
      },

      complete: function () {
        $("#loginBtn").text("Login").prop("disabled", false);
      }
    });
  }

  //  Render Error using Handlebars
  function showError(msg) {
    const source = $("#error-template").html();
    const template = Handlebars.compile(source);

    $("#errorContainer").html(template({ message: msg }));
  }

</script>

</body>
</html>
